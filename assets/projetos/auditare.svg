    <radialGradient id="glow" cx="0.75" cy="0.3" r="0.6"><stop offset="0" stop-color="#A78BFA" stop-opacity="0.4"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
